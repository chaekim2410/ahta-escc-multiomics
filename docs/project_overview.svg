<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">ESCC tumor multi-omics study overview</title>
  <desc id="desc">Paired tumor and adjacent normal tissues are profiled with DNA methylation and RNA sequencing, then integrated at gene and pathway levels.</desc>
  <defs>
    <linearGradient id="navy" x1="0" x2="1"><stop offset="0" stop-color="#102a43"/><stop offset="1" stop-color="#1f4e68"/></linearGradient>
    <linearGradient id="tumor" x1="0" x2="1"><stop offset="0" stop-color="#b73555"/><stop offset="1" stop-color="#7c1f43"/></linearGradient>
    <linearGradient id="normal" x1="0" x2="1"><stop offset="0" stop-color="#55a6bd"/><stop offset="1" stop-color="#277b99"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".18"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#718596"/></marker>
    <style>
      .h{font:700 34px Arial,sans-serif;fill:#fff}.sub{font:400 18px Arial,sans-serif;fill:#d8e8ef}
      .label{font:700 23px Arial,sans-serif;fill:#102a43}.body{font:400 17px Arial,sans-serif;fill:#304858}
      .white{font:700 23px Arial,sans-serif;fill:#fff}.smallwhite{font:400 16px Arial,sans-serif;fill:#f1f7fa}
      .metric{font:700 26px Arial,sans-serif;fill:#102a43}.muted{font:400 15px Arial,sans-serif;fill:#617686}
    </style>
  </defs>
  <rect width="1500" height="900" fill="#f5f8fa"/>
  <rect width="1500" height="125" fill="url(#navy)"/>
  <text x="65" y="55" class="h">ESCC multi-omics: tumor versus adjacent normal</text>
  <text x="65" y="91" class="sub">Do DNA methylation changes coincide with changes in gene expression?</text>

  <text x="65" y="170" class="label">Paired tissue design</text>
  <rect x="65" y="195" width="260" height="120" rx="18" fill="url(#normal)" filter="url(#shadow)"/>
  <text x="95" y="245" class="white">ADJACENT NORMAL</text><text x="95" y="278" class="smallwhite">reference tissue</text>
  <rect x="360" y="195" width="260" height="120" rx="18" fill="url(#tumor)" filter="url(#shadow)"/>
  <text x="390" y="245" class="white">ESCC TUMOR</text><text x="390" y="278" class="smallwhite">disease tissue</text>
  <line x1="325" y1="255" x2="355" y2="255" stroke="#718596" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="675" y="230" class="body">Each tumor is compared with its matched normal</text>
  <text x="675" y="263" class="body">from the same patient to control patient-specific variation.</text>

  <path d="M490 325 C490 360 360 350 360 405" fill="none" stroke="#718596" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M490 325 C490 360 1140 350 1140 405" fill="none" stroke="#718596" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="65" y="405" width="580" height="255" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="100" y="450" class="label">DNA methylation</text>
  <text x="100" y="485" class="body">EPIC array → CpG methylation profiles</text>
  <text x="100" y="520" class="body">minfi / ENmix → QC and normalization</text>
  <text x="100" y="555" class="body">limma → differential CpGs</text>
  <text x="100" y="590" class="body">bumphunter → differential regions</text>
  <text x="100" y="630" class="metric">35,994 CpGs · 3 DMRs</text>

  <rect x="855" y="405" width="580" height="255" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="890" y="450" class="label">RNA expression</text>
  <text x="890" y="485" class="body">RNA-seq counts → gene expression profiles</text>
  <text x="890" y="520" class="body">edgeR → normalization and paired model</text>
  <text x="890" y="555" class="body">Differential expression → altered genes</text>
  <text x="890" y="590" class="body">GO enrichment → altered processes</text>
  <text x="890" y="630" class="metric">7,305 / 24,315 genes</text>

  <line x1="355" y1="660" x2="650" y2="755" stroke="#718596" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="1145" y1="660" x2="850" y2="755" stroke="#718596" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="300" y="745" width="900" height="110" rx="22" fill="#e8d8ed" filter="url(#shadow)"/>
  <text x="345" y="785" class="label">Multi-omics integration</text>
  <text x="345" y="818" class="body">shared genes and shared biological processes</text>
  <text x="830" y="785" class="metric">RNA ∩ CpG = 1,000</text>
  <text x="830" y="818" class="metric">RNA ∩ DMR = 0 · GO overlap = 26</text>
</svg>
